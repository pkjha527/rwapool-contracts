[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
broadcast = "broadcast"

# Compiler settings
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Testing settings
gas_limit = 9223372036854775807
gas_price = 20000000000
gas_reports = ["*"]

# Formatting
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "thousands"
hex_underscore = "remove"

# Linting
ignore = []
deny_warnings = true

# Documentation
auto_detect_solc = false
bytecode_hash = "none"
cbor_metadata = false

# Network settings
[rpc_endpoints]
default = "${RPC_URL}"

[profile.fork]
url = "http://34.60.253.118:9545"
chain_id = 41295

# Invariant testing
[invariant]
runs = 256
depth = 15
fail_on_revert = false
call_override = false
dictionary_weight = 40
include_storage = true
include_push_bytes = true

# Fuzz testing
[fuzz]
runs = 256
max_test_rejects = 65536
seed = '0x3e8'
dictionary_weight = 40
include_storage = true
include_push_bytes = true